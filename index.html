<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#102321">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="おつり計算">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Uber現金おつり計算</title>
<style>
:root{color-scheme:dark;--line:#29413d;--mint:#75e0bd;--muted:#a9bfba}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#17312d 0,#071513 58%);color:#f4faf8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:calc(22px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}
main{max-width:520px;margin:auto}h1{font-size:24px;text-align:center;margin:10px 0 5px}.sub{text-align:center;color:var(--muted);font-size:13px;margin:0 0 24px}
.panel{background:rgba(16,35,33,.94);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 12px 35px #0005}
label{display:block;font-weight:700;font-size:14px;margin-bottom:8px}input{width:100%;border:1px solid #46615b;border-radius:12px;background:#091916;color:#fff;font-size:26px;padding:15px;outline:none}input:focus{border-color:var(--mint)}
.yen{position:absolute;right:15px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}.inputwrap{position:relative}
button{border:0;border-radius:12px;padding:13px 16px;font-weight:750;font-size:15px;cursor:pointer}.secondary{background:#20332f;color:#e8f4f0;border:1px solid #3d5750;width:100%}
.result{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0;border-bottom:1px solid #29413d}.result:last-child{border-bottom:0}
.amount{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}.change{font-size:22px;font-weight:850;color:var(--mint);font-variant-numeric:tabular-nums}
.small{font-size:12px;color:var(--muted);margin:0 0 8px}.heading{font-size:16px;font-weight:800;margin:0 0 10px}.empty{color:var(--muted);font-size:14px;text-align:center;padding:20px 0}
.copy{padding:8px 11px;font-size:12px;background:#20332f;color:#e8f4f0;border:1px solid #3d5750}
footer{text-align:center;color:#809791;font-size:11px;margin-top:18px;line-height:1.7}
</style>
</head>
<body><main>
<h1>現金おつり計算</h1><p class="sub">Uber配達用 · 商品代金を入れるだけ</p>
<section class="panel">
<label for="price">商品代金</label>
<div class="inputwrap"><input id="price" inputmode="numeric" type="number" min="0" placeholder="例：2359"><span class="yen">円</span></div>
</section>
<section class="panel">
<p class="heading">受取金額の候補 → お釣り</p><p class="small">候補をタップすると、お釣りをコピーできます。</p>
<div id="results" class="empty">商品代金を入力してください</div>
</section>
<button class="secondary" id="clear">✕　クリア</button>
<footer>一度開けば、次回から通信なしでも使えます。</footer>
</main>
<script>
const price=document.getElementById('price'),results=document.getElementById('results');
const yen=n=>Math.round(n).toLocaleString('ja-JP')+'円';
function render(){
 const raw=price.value,p=Number(raw);
 if(!raw||!Number.isFinite(p)||p<0){results.className='empty';results.textContent='商品代金を入力してください';return;}
 results.className='';results.replaceChildren();
 const vals=[Math.ceil((p+1)/100)*100,Math.ceil((p+1)/500)*500,Math.ceil((p+1)/1000)*1000,p+1000,Math.ceil((p+1)/5000)*5000,p+3000];
 [...new Set(vals)].filter(v=>v>p).sort((a,b)=>a-b).forEach(v=>{
  const row=document.createElement('div');row.className='result';
  const left=document.createElement('span');left.className='amount';left.textContent=yen(v);
  const group=document.createElement('div');group.style.display='flex';group.style.alignItems='center';group.style.gap='9px';
  const right=document.createElement('span');right.className='change';right.textContent=yen(v-p);
  const btn=document.createElement('button');btn.className='copy';btn.textContent='コピー';
  btn.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(yen(v-p));btn.textContent='コピー済み';setTimeout(()=>btn.textContent='コピー',1000)}catch(e){btn.textContent=yen(v-p)}});
  group.append(right,btn);row.append(left,group);results.append(row);
 });
}
price.addEventListener('input',render);document.getElementById('clear').addEventListener('click',()=>{price.value='';render();price.focus()});render();
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
</script></body></html>
